<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="./manifest.json" />
  <title>ERP PCP - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="login">
  <main class="content auth-content">
    <section class="panel glass">
      <h2>Acesso ao ERP PCP</h2>
      <p class="muted">Somente usuários autorizados podem acessar o sistema.</p>
      <form id="loginForm" class="form">
        <input id="loginUser" type="text" placeholder="Usuário" required />
        <input id="loginPass" type="password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
      <p class="muted login-hint">Credenciais de demonstração disponíveis em arquivo interno do projeto.</p>
      <ul id="loginLog" class="logs"></ul>
    </section>
    <footer class="app-footer">
      © 2026 Alex Codeworks. Todos os direitos reservados.
    </footer>
  </main>
  <script src="./auth.js"></script>
  <script src="./app.js"></script>
  <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }</script>
</body>
</html>
